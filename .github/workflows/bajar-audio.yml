name: Bajar audio de ElevenLabs

# Cuando llega un archivo pedidos/<nombre>.url con el enlace temporal del audio,
# GitHub lo descarga en audio/<nombre>.mp3 y borra el pedido.
on:
  push:
    paths:
      - "pedidos/*.url"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar audios pedidos
        run: |
          shopt -s nullglob
          mkdir -p audio
          for f in pedidos/*.url; do
            nombre=$(basename "$f" .url)
            echo "Descargando $nombre"
            curl -sSfL --retry 3 -o "audio/$nombre.mp3" "$(tr -d '[:space:]' < "$f")"
            git rm -q "$f"
          done

      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A audio pedidos
          git diff --cached --quiet && exit 0
          git commit -m "Audio descargado de ElevenLabs"
          git push
