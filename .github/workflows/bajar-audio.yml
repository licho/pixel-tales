name: Bajar audio de ElevenLabs

# Cuando llega un archivo pedidos/<nombre>.url con un enlace temporal, GitHub lo descarga
# en audio/<nombre> (si <nombre> no trae extensión se guarda como .mp3) y borra el pedido.
# Ejemplos: pedidos/ep01.url -> audio/ep01.mp3 ; pedidos/ep01.palabras.json.url -> audio/ep01.palabras.json
on:
  push:
    paths:
      - "pedidos/*.url"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Descargar pedidos
        run: |
          shopt -s nullglob
          mkdir -p audio
          for f in pedidos/*.url; do
            nombre=$(basename "$f" .url)
            destino="audio/$nombre"
            [[ "$nombre" == *.* ]] || destino="$destino.mp3"
            echo "Descargando $destino"
            curl -sSfL --retry 3 -o "$destino" "$(tr -d '[:space:]' < "$f")"
            git rm -q "$f"
          done

      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet && exit 0
          if ! git commit -q -m "Audio descargado de ElevenLabs" > git.log 2>&1; then
            echo "::error title=commit::$(tr '\n' ' ' < git.log)"; exit 1
          fi
          if ! git push origin "HEAD:${GITHUB_REF_NAME}" > git.log 2>&1; then
            echo "::error title=push::$(tr '\n' ' ' < git.log)"; exit 1
          fi
