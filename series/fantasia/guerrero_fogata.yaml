# Frame de prueba: fantasía oscura. Un guerrero junto a la fogata en el bosque; entes lo observan desde la oscuridad.
titulo: "El guerrero y la fogata"
estilo: nahual
formato: vertical
subtitulos: false

paneles:
  - escena: bosque
    params: {hora: noche, niebla: true, fogata: [0.72, 0.93, 34], luna: 0.35, semilla: 7}
    efectos: [ceniza]
    camara: {pan: 3}
    duracion: 8
    actores:
      - sprite: xibalba/sombra
        pos: [40, 252]
        escala: 1.1
        brillo: 0.15
        contraluz: false
      - sprite: xibalba/sombra
        pos: [196, 246]
        escala: 0.9
        espejo: true
        brillo: 0.15
        contraluz: false
      - sprite: xibalba/sombra
        pos: [150, 238]
        escala: 0.6
        brillo: 0.2
        contraluz: false
      - ojos: {pos: [92, 226], color: [255, 60, 36], separacion: 4, tam: 1, fase: 0.4}
      - ojos: {pos: [230, 232], color: [255, 60, 36], separacion: 4, tam: 1, fase: 1.9}
      - sprite: fantasia/guerrero_sentado
        pos: [118, 362]
        escala: 1.1
