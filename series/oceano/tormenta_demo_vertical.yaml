# Demo: panel 1 hecho con código (escena mar_tormenta + sprites); panel 2 = imagen de Gemini pasada por el motor.
estilo: oceano
formato: vertical
subtitulos: false
paneles:
  - escena: mar_tormenta
    params: {espuma: [[0.5, 0.76, 0.5]], claro: [0.85, 0.42]}
    efectos: [lluvia, relampago]
    lluvia: {cantidad: 380, viento: -0.18, largo: 1.7, salpicaduras: false}
    camara: {pan: 0}
    actores:
      - sprite: oceano/primigenio
        pos: [134, 300]
        escala: 1.3
        contraluz: false
      - sprite: oceano/pesquero
        pos: [80, 330]
        flota: 1.5
        balanceo: 6
        escala: 1.2
    duracion: 8
  - escena: imagen
    params: {archivo: fondos/oceano/cthulhu_gemini.jpg, foco: [0.6, 0.5]}
    efectos: [lluvia, relampago]
    lluvia: {cantidad: 260, viento: -0.18, largo: 1.7, salpicaduras: false}
    camara: {pan: 0}
    duracion: 8
