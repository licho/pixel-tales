# EL DOBLE — reel vertical (~60 s). Guion de Luis. Ilustraciones: Gemini (fondos/nahuales/el_doble/) + efectos del motor.
# Voces (pendientes): NARRADOR, CHICO (voz en off / susurro) y VOZ (el doble, misma voz del chico).
# Coordenadas en pixeles de arte: vertical = 256 x 384 (la vista es 216 x 384).
titulo: "El doble"
estilo: nahual
formato: vertical
subtitulos: true

paneles:
- escena: negro
  params: {niebla: true}
  titulo: EL DOBLE
  camara: {pan: 0}
  actores:
  - ojos:
      pos: [128, 190]
      color: [240, 200, 70]
      separacion: 10
      tam: 2
      aparece: 1.2
  texto: 'En algunas comunidades de México existe una creencia inquietante: que una persona puede tener un doble animal.'
- escena: imagen
  params:
    archivo: fondos/nahuales/el_doble/panel02.png
    zoom: [1.0, 1.12]
    foco: [0.5, 0.42]
    luces:
    - pos: [286, 40]
      radio: 320
      intensidad: 0.35
      color: [255, 190, 120]
      parpadeo: farol
  camara: {pan: 0}
  efectos: [ceniza]
  texto: Y que lo que le suceda a uno… puede destruir al otro.
- escena: imagen
  params:
    archivo: fondos/nahuales/el_doble/panel03.png
    zoom: [1.0, 1.12]
    foco: [0.5, 0.45]
    foco_final: [0.58, 0.42]
    luces:
    - pos: [352, 295]
      radio: 130
      intensidad: 0.45
      color: [255, 180, 110]
      parpadeo: farol
  camara: {pan: 0}
  texto: Llevaba meses investigando los relatos sobre nahuales. Creía que eran supersticiones…
- escena: imagen
  params:
    archivo: fondos/nahuales/el_doble/panel04.png
    zoom: [1.0, 1.3]
    foco: [0.5, 0.42]
    foco_final: [0.72, 0.39]
  camara: {pan: 0}
  actores:
  - ojos:
      pos: [429, 390]
      separacion: 8
      color: &id001 [240, 200, 70]
      aparece: 1.5
  texto: …hasta que encontré una fotografía de mi abuelo.
- escena: foto_mesa
  params: {contenido: reverso, texto: 12 · agosto · 1961|Lago de la montaña|(no regreses), giro: -3, semilla: 3}
  camara: {pan: 3}
  duracion: 3.0
