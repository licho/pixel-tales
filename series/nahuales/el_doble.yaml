# EL DOBLE — reel vertical (~60 s). Guion de Luis.
# Voces (pendientes): NARRADOR, CHICO (voz en off / susurro) y VOZ (el doble, misma voz del chico).
# Coordenadas en pixeles de arte: vertical = 256 x 384 (la vista es 216 x 384).
titulo: "El doble"
estilo: nahual
formato: vertical
subtitulos: true

paneles:
  # [0:00–0:06] LA CREENCIA
  - escena: negro
    params: {niebla: true}
    titulo: "EL DOBLE"
    camara: {pan: 0}
    actores:
      - ojos: {pos: [128, 190], color: [240, 200, 70], separacion: 10, tam: 2, aparece: 1.2}
    texto: "En algunas comunidades de México existe una creencia inquietante: que una persona puede tener un doble animal."   # NARRADOR

  - escena: foto_mesa
    params: {contenido: hombre_jaguar}
    efectos: [ceniza]
    camara: {pan: 4}
    texto: "Y que lo que le suceda a uno… puede destruir al otro."   # NARRADOR

  # [0:07–0:16] LA INVESTIGACIÓN
  - escena: archivo
    camara: {pan: 6}
    actores:
      - sprite: nahual/chico_escritorio
        pos: [133, 360]
        escala: 1.3
    texto: "Llevaba meses investigando los relatos sobre nahuales. Creía que eran supersticiones…"   # CHICO

  - escena: foto_mesa
    params: {contenido: abuelo, giro: 2, semilla: 3}
    camara: {pan: 4}
    texto: "…hasta que encontré una fotografía de mi abuelo."   # CHICO

  - escena: foto_mesa
    params: {contenido: reverso, texto: "12 · agosto · 1961|Lago de la montaña|(no regreses)", giro: -3, semilla: 3}
    camara: {pan: 3}
    duracion: 3.0

  # [0:17–0:26] LA PRUEBA
  - escena: bosque
    params: {hora: tarde, huellas: true}
    camara: {pan: 8}
    actores:
      - sprite: nahual/chico_camara
        pos: [70, 372]
        escala: 1.5
    duracion: 3.5

  - escena: bosque
    params: {hora: tarde, huellas: true, semilla: 2}
    efectos: [grabacion]
    grabacion_inicio: 754
    camara: {pan: 4}
    actores:
      - sprite: nahual/jaguar
        pos: [168, 248]
        escala: 0.6
        aparece: 1.6
        desaparece: 2.2
      - ojos: {pos: [154, 238], color: [240, 200, 70], separacion: 2, tam: 1, aparece: 1.6}
    duracion: 3.5

  - escena: negro
    params: {luz: true}
    efectos: [pausa]
    congelado: true
    subtitulos_y: 0.86
    grabacion_inicio: 756
    actores:
      - sprite: nahual/jaguar_rostro
        pos: [128, 300]
        escala: 2.2
    texto: "No puede ser…"   # CHICO (susurrando)
    duracion: 3.0

  # [0:27–0:37] EL LLAMADO
  - escena: lago
    params: {vista: orilla, hora: anochecer}
    camara: {pan: 6}
    actores:
      - sprite: nahual/lancha
        pos: [128, 356]
        escala: 1.1
      - sprite: nahual/chico_camara
        pos: [40, 378]
        escala: 1.3
    duracion: 4.0

  - escena: foto_mesa
    params: {contenido: bebe, superficie: lancha, giro: 5}
    camara: {pan: 3}
    actores:
      - ojos: {pos: [159, 146], color: [240, 200, 70], separacion: 3, tam: 1, aparece: 1.0}
    texto: "Por fin llegaste."   # VOZ (la del chico, desde el bosque)

  - escena: bosque
    params: {hora: noche, semilla: 5}
    camara: {pan: 4}
    actores:
      - sprite: nahual/nahual_silueta
        pos: [128, 250]
        escala: 0.9
        aparece: 0.8
    duracion: 3.0

  - escena: negro
    duracion: 1.0      # corte a negro: grito ahogado

  # [0:38–0:50] EL VIAJE
  - escena: lago
    params: {vista: aerea, hora: noche}
    camara: {pan: 0}
    actores:
      - sprite: nahual/sombra_agua
        pos: [126, 420]
        escala: 0.9
        movimiento: [0, -14]
        aparece: 0.01
      - sprite: nahual/lancha_aerea
        pos: [128, 360]
        escala: 0.6
        movimiento: [0, -14]
        aparece: 0.01
    duracion: 9.0      # ningún motor, ningún remo: solo algo respirando

  # [0:51–1:00] EL DOBLE
  - escena: bosque
    params: {hora: noche, orilla: true, semilla: 7}
    camara: {pan: 4}
    actores:
      - sprite: nahual/lancha
        pos: [118, 378]
        escala: 1.2
      - sprite: nahual/chico_tendido
        pos: [118, 366]
        escala: 1.1
      - sprite: nahual/chico_doble
        pos: [150, 252]
        escala: 0.8
    texto: "Él creía que estaba buscando a los nahuales…"   # NARRADOR (susurrando)

  - escena: bosque
    params: {hora: noche, orilla: true, semilla: 7}
    camara: {pan: 6}
    actores:
      - sprite: nahual/lancha
        pos: [118, 378]
        escala: 1.2
      - sprite: nahual/chico_tendido
        pos: [118, 366]
        escala: 1.1
      - sprite: nahual/doble_cuatro_patas
        pos: [150, 252]
        escala: 0.75
        movimiento: [12, -2]
        aparece: 0.01
    texto: "Pero su doble llevaba toda la vida buscándolo a él."   # NARRADOR

  - escena: negro
    actores:
      - ojos: {pos: [128, 190], color: [240, 200, 70], separacion: 10, tam: 2, aparece: 0.6}
    duracion: 2.5      # último sonido: rugido de jaguar
